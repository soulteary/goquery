name: Go quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: soulteary/go-test-report-action@v1.1.3
        with:
          version: v1.1.3
          race: 'true'
          coverage_threshold: '100'
          package_threshold: '100'
          commit: 'false'
      - uses: soulteary/goreportcard-action@v1.1.4
        with:
          version: v1.1.4
          commit: 'false'
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-quality-reports
          include-hidden-files: true
          path: |
            .github/coverage.svg
            .github/go-test-report.md
            .github/go-test-report.json
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: go-quality-reports
          path: ${{ runner.temp }}/go-quality-reports
      - name: Publish reports for the tested revision
        env:
          REPORT_DIR: ${{ runner.temp }}/go-quality-reports
          TESTED_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "The checked-out revision differs from the tested revision; leaving reports as workflow artifacts."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin reports >/dev/null 2>&1; then
            git fetch origin reports:refs/remotes/origin/reports
            git switch --force-create reports origin/reports
          else
            git switch --orphan reports
            git rm -rf . || true
          fi
          cp "$REPORT_DIR/coverage.svg" .
          cp "$REPORT_DIR/go-test-report.md" .
          cp "$REPORT_DIR/go-test-report.json" .
          cp "$REPORT_DIR/goreportcard.svg" .
          cp "$REPORT_DIR/goreportcard-report.md" .
          git add coverage.svg go-test-report.md go-test-report.json goreportcard.svg goreportcard-report.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update Go quality reports [skip ci]'
            git push origin HEAD:reports
          fi
